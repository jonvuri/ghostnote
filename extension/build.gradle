plugins {
    id 'java'
}

group = 'com.ghostnote'
version = '0.0.1'

// Bitwig 6.0.6 bundles a Java 25 JVM; target 21 (LTS) for headroom.
//
// Deliberately `options.release` and NOT a `java { toolchain }` block: a
// toolchain pins an exact JDK and would force a provisioning download (or fail)
// on a machine running anything else — this one builds on Temurin 26. `release`
// already guarantees 21-compatible bytecode against the 21 API, which is the
// property that matters, and it builds on any JDK >= 21.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Reproducible builds: without these the jar embeds file mtimes and filesystem
// ordering, so two builds of identical source differ byte-for-byte. Phase 0
// exit criterion 2 is "both builds reproduce from a clean checkout".
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.bitwig.com'
    }
}

dependencies {
    // Provided by Bitwig at runtime
    compileOnly 'com.bitwig:extension-api:25'

    // Bundled into the extension jar
    implementation 'com.google.code.gson:gson:2.11.0'
}

jar {
    archiveBaseName = 'ghostnote'
    archiveExtension = 'bwextension'

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Extension-Class': 'com.ghostnote.extension.GhostnoteExtensionDefinition'
        )
    }
}

def bitwigExtensionsDir = "${System.getProperty('user.home')}/Documents/Bitwig Studio/Extensions"

// ⚠ Deploy is a two-step copy-then-RENAME, not a plain Copy into place.
//
// Bitwig hot-reloads the extension when the file changes, and a plain Copy
// rewrites it in place — so Bitwig can start reading a half-written zip. When
// that happened (E16) it failed with `ZipException: invalid LOC header` ->
// `ClassNotFoundException`, and the broken instance kept port 8686 bound, so
// every later instance died with `Address already in use` and the bridge
// connected-but-never-answered. Only restarting Bitwig cleared it.
//
// A rename within the same filesystem is atomic: Bitwig either sees the old
// complete file or the new complete file, never a torn one.
tasks.register('copyExtension') {
    dependsOn jar
    doLast {
        def target = file("${bitwigExtensionsDir}/${jar.archiveFileName.get()}")
        def staging = file("${bitwigExtensionsDir}/.${jar.archiveFileName.get()}.staged")
        staging.parentFile.mkdirs()
        staging.bytes = jar.archiveFile.get().asFile.bytes
        java.nio.file.Files.move(
            staging.toPath(), target.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        println "Deployed (atomic rename) to: ${target}"
    }
}
