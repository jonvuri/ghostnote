plugins {
    id 'java'
}

group = 'com.ghostnote'
version = '0.0.1'

// Bitwig 6.0.6 bundles a Java 25 JVM; target 21 (LTS) for headroom.
//
// Deliberately `options.release` and NOT a `java { toolchain }` block: a
// toolchain pins an exact JDK and would force a provisioning download (or fail)
// on a machine running anything else — this one builds on Temurin 26. `release`
// already guarantees 21-compatible bytecode against the 21 API, which is the
// property that matters, and it builds on any JDK >= 21.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Reproducible builds: without these the jar embeds file mtimes and filesystem
// ordering, so two builds of identical source differ byte-for-byte. Phase 0
// exit criterion 2 is "both builds reproduce from a clean checkout".
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.bitwig.com'
    }
}

// ⚠ The API source is a READING aid, not a dependency. It is held in its own
// configuration so that nothing on the compile or runtime path can ever see it.
//
// Why it exists: the API ships no javadoc jar, so before this, enumerating a
// type's members meant a live probe (E16o counted `InsertionPoint`'s 14 members
// that way) or reading a third party's redistributed copy. `maven.bitwig.com`
// publishes the `-sources` classifier beside the compile artifact, so the
// authoritative source can simply be resolved.
//
// An ordinary `build` never resolves this: no task depends on the configuration.
// Run `./gradlew bitwigApiSourcePath` to fetch it and print where it landed.
configurations {
    bitwigApiSource {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // Provided by Bitwig at runtime
    compileOnly 'com.bitwig:extension-api:25'

    // Bundled into the extension jar
    implementation 'com.google.code.gson:gson:2.11.0'

    // Reading aid only — see the comment above. Never on any classpath.
    bitwigApiSource 'com.bitwig:extension-api:25:sources'
}

tasks.register('bitwigApiSourcePath') {
    group = 'help'
    description = 'Resolves the Bitwig extension-api sources jar and prints its cache path.'
    def resolved = configurations.bitwigApiSource
    inputs.files(resolved)
    doLast {
        resolved.files.each { println it.absolutePath }
    }
}

def registerRuntimeProfileResource = { taskName, identity ->
    def output = layout.buildDirectory.file(
        "generated/runtime-profiles/${taskName}/ghostnote-runtime-profile.txt")
    return tasks.register(taskName) {
        inputs.property('runtimeProfile', identity)
        outputs.file(output)
        doLast {
            def outputFile = output.get().asFile
            outputFile.parentFile.mkdirs()
            outputFile.setText("${identity}\n", 'UTF-8')
        }
    }
}

def normalProfileResource = registerRuntimeProfileResource(
    'normalRuntimeProfileResource', 'normal-v1')
def captureProfileResource = registerRuntimeProfileResource(
    'captureRuntimeProfileResource', 'capture-v1')
def probeProfileResource = registerRuntimeProfileResource(
    'probeRuntimeProfileResource', 'phase-8-probe-v1')

def configureExtensionArchive = { task, extensionClass, profileResource ->
    task.archiveBaseName = 'ghostnote'
    task.archiveExtension = 'bwextension'
    task.from(profileResource)
    task.from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    task.inputs.property('extensionDefinition', extensionClass)
    task.filesMatching('META-INF/services/com.bitwig.extension.ExtensionDefinition') {
        filter { String line -> extensionClass }
    }
    task.manifest {
        attributes('Extension-Class': extensionClass)
    }
}

configureExtensionArchive(
    jar,
    'com.ghostnote.extension.GhostnoteExtensionDefinition',
    normalProfileResource)

tasks.register('captureJar', Jar) {
    dependsOn classes
    archiveClassifier = 'capture'
    from sourceSets.main.output
    configureExtensionArchive(
        delegate,
        'com.ghostnote.extension.GhostnoteCaptureExtensionDefinition',
        captureProfileResource)
}

tasks.register('probeJar', Jar) {
    dependsOn classes
    archiveClassifier = 'probe'
    from sourceSets.main.output
    configureExtensionArchive(
        delegate,
        'com.ghostnote.extension.GhostnoteProbeExtensionDefinition',
        probeProfileResource)
}

tasks.register('shadowProbeJar', Jar) {
    dependsOn classes
    archiveClassifier = 'shadow-8g-controls'
    from sourceSets.main.output
    configureExtensionArchive(
        delegate,
        'com.ghostnote.extension.GhostnoteShadowCacheExtensionDefinition',
        probeProfileResource)
}

tasks.register('verifyExtensionArchives') {
    dependsOn jar, captureJar, probeJar, shadowProbeJar
    doLast {
        ['jar': 'normal-v1', 'captureJar': 'capture-v1',
         'probeJar': 'phase-8-probe-v1', 'shadowProbeJar': 'phase-8-probe-v1'].each { taskName, profile ->
            def archive = tasks.named(taskName).get().archiveFile.get().asFile
            new java.util.jar.JarFile(archive).withCloseable { contents ->
                def definition = contents.manifest.mainAttributes.getValue('Extension-Class')
                def registration = contents.getInputStream(contents.getJarEntry(
                    'META-INF/services/com.bitwig.extension.ExtensionDefinition')).getText('UTF-8').trim()
                if (registration != definition) {
                    throw new GradleException("${taskName}: service registration differs from the manifest")
                }
                if (contents.getJarEntry(definition.replace('.', '/') + '.class') == null) {
                    throw new GradleException("${taskName}: registered definition class is absent")
                }
                def bundledProfile = contents.getInputStream(contents.getJarEntry(
                    'ghostnote-runtime-profile.txt')).getText('UTF-8').trim()
                if (bundledProfile != profile) {
                    throw new GradleException("${taskName}: bundled runtime profile differs")
                }
            }
        }
        println 'Extension archive registrations and runtime profiles agree.'
    }
}

tasks.named('check') { dependsOn verifyExtensionArchives }

def bitwigExtensionsDir = "${System.getProperty('user.home')}/Documents/Bitwig Studio/Extensions"

// ⚠ Deploy is a two-step copy-then-RENAME, not a plain Copy into place.
//
// Bitwig hot-reloads the extension when the file changes, and a plain Copy
// rewrites it in place — so Bitwig can start reading a half-written zip. When
// that happened (E16) it failed with `ZipException: invalid LOC header` ->
// `ClassNotFoundException`, and the broken instance kept port 8686 bound, so
// every later instance died with `Address already in use` and the bridge
// connected-but-never-answered. Only restarting Bitwig cleared it.
//
// A rename within the same filesystem is atomic: Bitwig either sees the old
// complete file or the new complete file, never a torn one.
tasks.register('copyExtension') {
    dependsOn jar
    doLast {
        def target = file("${bitwigExtensionsDir}/${jar.archiveFileName.get()}")
        def staging = file("${bitwigExtensionsDir}/.${jar.archiveFileName.get()}.staged")
        staging.parentFile.mkdirs()
        staging.bytes = jar.archiveFile.get().asFile.bytes
        java.nio.file.Files.move(
            staging.toPath(), target.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        println "Deployed (atomic rename) to: ${target}"
    }
}

def registerProfileDeploy = { taskName, archiveTaskName ->
    tasks.register(taskName) {
        dependsOn archiveTaskName
        doLast {
            def archiveTask = tasks.named(archiveTaskName).get()
            def deployedName = jar.archiveFileName.get()
            def target = file("${bitwigExtensionsDir}/${deployedName}")
            def staging = file("${bitwigExtensionsDir}/.${deployedName}.staged")
            staging.parentFile.mkdirs()
            staging.bytes = archiveTask.archiveFile.get().asFile.bytes
            java.nio.file.Files.move(
                staging.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            println "Deployed ${archiveTaskName} (atomic rename) to: ${target}"
        }
    }
}

registerProfileDeploy('copyCaptureExtension', 'captureJar')
registerProfileDeploy('copyProbeExtension', 'probeJar')

tasks.register('copyShadowProbeExtension') {
    dependsOn shadowProbeJar
    doLast {
        def archiveTask = tasks.named('shadowProbeJar').get()
        def target = file("${bitwigExtensionsDir}/ghostnote-shadow-8g-controls.bwextension")
        def staging = file("${bitwigExtensionsDir}/.ghostnote-shadow-8g-controls.bwextension.staged")
        staging.bytes = archiveTask.archiveFile.get().asFile.bytes
        java.nio.file.Files.move(
            staging.toPath(), target.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        println "Deployed distinct 8g controls (atomic rename) to: ${target}"
    }
}

// The cache harness runs as a Java program and needs no running Bitwig instance.
sourceSets {
    shadowCacheTest {
        java.srcDir 'src/shadowCacheTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    shadowCacheTestImplementation.extendsFrom implementation
    shadowCacheTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // Adapter tests use host proxies. The API stays outside extension archives.
    shadowCacheTestRuntimeOnly 'com.bitwig:extension-api:25'
}

tasks.register('shadowCacheTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowProjectCacheTest'
}

tasks.register('shadowCacheProbeTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowCacheProbeTest'
}

tasks.register('shadowInventoryRebuildTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowInventoryRebuildTest'
}

tasks.register('shadowObserverBudgetTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowObserverBudgetTest'
}

tasks.register('shadowHandlePoolTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowHandlePoolTest'
}

tasks.register('shadowAuthorityFallbackTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ShadowAuthorityFallbackTest'
