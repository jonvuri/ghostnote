tasks.register('soundingCellBudgetTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.SoundingCellBudgetTest'
