tasks.register('replayEpochTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ReplayEpochTest'
}

tasks.named('check') {
    dependsOn 'replayEpochTest', 'soundingCellBudgetTest', 'shadowCacheTest', 'shadowCacheProbeTest', 'shadowInventoryRebuildTest', 'shadowObserverBudgetTest', 'shadowHandlePoolTest', 'shadowAuthorityFallbackTest', 'shadowSceneControlTest', 'shadowTopologyControlTest'
}

tasks.register('replaySelectionActionsTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ReplaySelectionActionsTest'
}
tasks.named('check') { dependsOn 'replaySelectionActionsTest' }

tasks.register('replayFetchTest', JavaExec) {
    dependsOn shadowCacheTestClasses
    classpath = sourceSets.shadowCacheTest.runtimeClasspath
    mainClass = 'com.ghostnote.extension.ReplayFetchTest'
}
tasks.named('check') { dependsOn 'replayFetchTest' }
