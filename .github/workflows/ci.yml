# ghostnote CI — the unattended offline gate.
#
# Run 31974448060 passed for Phase 1 candidate
# 01b716265a20cbf91e6c2c1e357fb69d489ee707 on 2026-08-16. The brain job ran
# `npm run check` with the required Python oracle. The extension job built with
# Java 21. See E40.
#
# Nothing here touches Bitwig. Live probes need a running DAW. Some also need a
# human editor. Run them manually under the E40 regression policy.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  brain:
    name: brain (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: brain/package-lock.json

      - name: install
        working-directory: brain
        run: npm ci

      - name: typecheck + offline tests
        working-directory: brain
        # ubuntu-latest ships python3, so the bwmod oracle cross-check MUST run
        # here rather than self-skipping — see oracle.test.ts.
        env:
          GHOSTNOTE_REQUIRE_ORACLE: '1'
        run: npm run check

  extension:
    name: extension (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # `options.release = 21` in build.gradle guarantees the bytecode
          # target; any JDK >= 21 can build it.
          distribution: temurin
          java-version: '21'

      - name: build
        working-directory: extension
        run: ./gradlew --no-daemon build
